# LogiTrack WMS - Configuración Producción

# Base de datos - Usar variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT - Usar variables de entorno (NUNCA hardcodeado en producción)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# DDL auto: validate (NO permite crear/modificar tablas automáticamente)
spring.jpa.hibernate.ddl-auto=validate

# Desactivar SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones optimizado
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
