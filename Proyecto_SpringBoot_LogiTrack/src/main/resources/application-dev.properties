# LogiTrack WMS - Configuración Desarrollo Local

# Base de datos local (puedes cambiarla por H2 o tu PostgreSQL local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}




# JWT - En desarrollo usamos el secret hardcodeado
jwt.secret=1q2w3e4r5t6y7u8i9oier982r28fidsoh2hf98ewhfewhf89whfsdihf982hf8hw98fh2h38fhsdhfsidhf98whf98sdhf89s9d8f
jwt.expiration-ms=86400000

# DDL auto: update para desarrollo (crea/actualiza tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update

# SQL logging detallado
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON
spring.jackson.serialization.fail-on-empty-beans=false

# Inicialización de datos de prueba
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
