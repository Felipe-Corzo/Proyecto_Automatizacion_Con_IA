# LogiTrack WMS - Configuración Principal
# ==========================================
# Los valores específicos por entorno se definen en:
#   - application-dev.properties  (desarrollo)
#   - application-prod.properties (producción)
# ==========================================
spring.application.name=logitrack
server.port=8080

# Spring active profile (dev por defecto)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuración de Base de Datos PostgreSQL

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=proyecto
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# Jackson JSON
spring.jackson.serialization.fail-on-empty-beans=false

# Inicialización de Scripts SQL
spring.sql.init.mode=always

# Configuración JWT (valores por defecto para desarrollo local)
jwt.secret=${JWT_SECRET:1q2w3e4r5t6y7u8i9oier982r28fidsoh2hf98ewhfewhf89whfsdihf982hf8hw98fh2h38fhsdhfsidhf98whf98sdhf89s9d8f}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
